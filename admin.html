<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Leblon Prime</title>
  <style>
    :root { 
      --bg: #000000; --surface: #151515; --gold: #fcc010; 
      --oxblood: #e31821; --cream: #ffffff; --line: #2a2a2a; --green: #28a745;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--cream); font-family: system-ui, sans-serif; margin: 0; padding: 28px 16px 60px; display: flex; flex-direction: column; align-items: center; }
    
    .escondido { display: none !important; }
    .header { text-align: center; margin-bottom: 28px; width: 100%; }
    .header h1 { font-size: 1.8rem; margin: 0; color: var(--cream); text-transform: uppercase; font-weight: 900; }
    .header .sub { font-size: 0.75rem; color: var(--gold); margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
    
    .ticket-app { width: 100%; max-width: 800px; margin: 0 auto; overflow: hidden; }
    .login-container { width: 100%; max-width: 400px; margin: 60px auto; background: var(--surface); padding: 35px 25px; border-radius: 12px; border: 1px solid var(--line); text-align: center; }
    
    .form-input { width: 100%; padding: 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--cream); font-size: 1rem; margin-bottom: 15px; }
    .btn { background: var(--gold); color: var(--bg); border: none; padding: 14px; border-radius: 6px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; }
    
    .btn-rm { background: transparent; color: var(--oxblood); border: 1px solid var(--oxblood); padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-ok { background: var(--green); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .row { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); flex-wrap: wrap; gap: 10px; }
    .contagem { font-weight: 900; font-size: 1.3rem; color: var(--bg); background: var(--gold); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
    .acoes-manuais { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN DO ADMIN -->
  <div id="tela-login" class="login-container">
    <h2 style="color: var(--cream); margin-top: 0;">LEBLON <span style="color: var(--gold);">PRIME</span></h2>
    <p style="opacity: 0.8; font-size: 0.9rem;">Controle do Responsável</p>
    <input type="password" id="login-senha" placeholder="Senha do Admin" class="form-input">
    <button class="btn" onclick="entrarComoAdmin()" style="background: var(--oxblood); color: white;">ENTRAR NO PAINEL</button>
  </div>

  <!-- TELA DO ADMIN -->
  <div id="tela-admin" class="escondido ticket-app">
    <div class="header">
      <h1>LEBLON <span style="color: var(--oxblood);">PRIME</span></h1>
      <div class="sub">PAINEL ADMINISTRATIVO (TEMPO REAL)</div>
    </div>

    <h3 style="color: var(--oxblood); border-bottom: 1px solid var(--oxblood); padding-bottom: 5px;">⚠️ Aguardando Retorno (Na Rua)</h3>
    <div id="admin-pendentes">Nenhum motoboy na rua agora.</div>

    <h3 style="color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 5px; margin-top: 30px;">✅ Concluídas Hoje</h3>
    <div id="admin-concluidas">Carregando...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, serverTimestamp, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsKT8yM2UJ6dSonbab2ETSidi1KLF6GbM",
      authDomain: "leblon-prime-entregas.firebaseapp.com",
      projectId: "leblon-prime-entregas",
      storageBucket: "leblon-prime-entregas.firebasestorage.app",
      messagingSenderId: "872333644229",
      appId: "1:872333644229:web:8231a0806055c1dab9bbac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let dataHoje = new Date().toISOString().split('T')[0];

    window.entrarComoAdmin = function() {
      if(document.getElementById("login-senha").value === "1234") {
        document.getElementById("tela-login").classList.add("escondido");
        document.getElementById("tela-admin").classList.remove("escondido");
        iniciarEscutaAdmin();
      } else {
        alert("Senha Incorreta!");
      }
    };

    function iniciarEscutaAdmin() {
      // Escuta os motoboys que avisaram saída
      onSnapshot(collection(db, "pendentes"), (snapshot) => {
        const div = document.getElementById("admin-pendentes");
        div.innerHTML = "";
        if(snapshot.empty) div.innerHTML = "<p>Nenhum motoboy na rua.</p>";
        snapshot.forEach((d) => {
          const p = d.data();
          div.innerHTML += `
            <div class="row" style="border-color: var(--oxblood);">
              <div><b>${p.motoboy}</b> levou ${p.qtd} pedido(s) às ${p.hora}</div>
              <button class="btn-ok" onclick="confirmarChegada('${d.id}', '${p.motoboy}', ${p.qtd})">CONFIRMAR RETORNO</button>
            </div>`;
        });
      });

      // Escuta as entregas concluídas hoje e agrupa por nome
      const qHoje = query(collection(db, "entregas"), where("data", "==", dataHoje));
      onSnapshot(qHoje, (snapshot) => {
        const contagem = {};
        snapshot.forEach(d => {
          const nome = d.data().motoboy;
          contagem[nome] = (contagem[nome] || 0) + 1;
        });
        
        const div = document.getElementById("admin-concluidas");
        div.innerHTML = "";
        if(Object.keys(contagem).length === 0) div.innerHTML = "<p>Nenhuma entrega concluída hoje ainda.</p>";
        
        for (const [nome, qtd] of Object.entries(contagem)) {
          div.innerHTML += `
            <div class="row">
              <div style="font-size: 1.2rem; font-weight: bold; flex: 1; min-width: 150px;">${nome}</div>
              
              <div class="acoes-manuais">
                <div class="contagem">${qtd}</div>
                <button class="btn-ok" style="background: var(--gold); color: var(--bg); font-size: 1.3rem; padding: 4px 12px;" onclick="adicionarEntregaManual('${nome}')" title="Adicionar 1 entrega">+</button>
                <button class="btn-rm" style="font-size: 1.3rem; padding: 4px 12px;" onclick="removerEntregaManual('${nome}')" title="Remover 1 entrega">-</button>
              </div>
            </div>`;
        }
      });
    }

    // Aprova a chegada de quem estava na rua
    window.confirmarChegada = async function(docId, motoboy, qtd) {
      await deleteDoc(doc(db, "pendentes", docId));
      for(let i=0; i<qtd; i++){
        await addDoc(collection(db, "entregas"), { motoboy: motoboy, data: dataHoje, timestamp: serverTimestamp() });
      }
    };

    // Ação: Botão [+]
    window.adicionarEntregaManual = async function(motoboy) {
      await addDoc(collection(db, "entregas"), { 
        motoboy: motoboy, 
        data: dataHoje, 
        timestamp: serverTimestamp() 
      });
    };

    // Ação: Botão [-]
    window.removerEntregaManual = async function(motoboy) {
      // Busca apenas 1 entrega de hoje deste motoboy específico para deletar
      const q = query(
        collection(db, "entregas"), 
        where("motoboy", "==", motoboy), 
        where("data", "==", dataHoje),
        limit(1)
      );
      
      const snapshot = await getDocs(q);
      
      if (!snapshot.empty) {
        // Pega o ID desse documento e deleta
        const docId = snapshot.docs[0].id;
        await deleteDoc(doc(db, "entregas", docId));
      }
    };
  </script>
</body>
</html>
